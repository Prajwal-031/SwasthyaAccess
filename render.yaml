# Render Blueprint: deploy the FastAPI backend from the backend/ directory.
# Create Neon PostgreSQL separately, then set DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: swasthyaaccess-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WHISPER_ENABLED
        value: "false"
      - key: WHISPER_MODEL
        value: base
      - key: MAX_AUDIO_MB
        value: "15"
